name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Both ends of the supported range. The floor is what `engines.twenty`
    # promises, and self-hosted instances sit on it for months — a promise
    # nothing tests is a promise waiting to break.
    #
    # These are Docker Hub tags of `twentycrm/twenty-app-dev`, and the release
    # tags carry the `v`. A bare `2.20.0` is not an image: the floor job died
    # in the "Spawn Twenty test instance" step, before the app was touched, for
    # as long as the matrix said so.
    strategy:
      fail-fast: false
      matrix:
        twenty-version: ['v2.20.0', 'latest']
    name: test (twenty ${{ matrix.twenty-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Spawn Twenty test instance
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@main
        with:
          twenty-version: ${{ matrix.twenty-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      - name: Run integration tests
        run: yarn test
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}
